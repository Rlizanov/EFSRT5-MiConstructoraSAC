spring.application.name=crudspring

# Conexión a SQL Server Express con Autenticación de Windows
# Nota: Se usa doble barra diagonal invertida (\\) para escapar el nombre de la instancia SQLEXPRESS
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=bd_empleados;integratedSecurity=true;encrypt=true;trustServerCertificate=true;

# Como usamos Autenticación de Windows, dejamos esto vacío o comentado
# spring.datasource.username=
# spring.datasource.password=

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Update creará las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=9125