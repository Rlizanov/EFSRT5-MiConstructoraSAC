<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Mi Constructora S.A.C</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-primary fw-bold">Gestión de Accesos (Usuarios)</h3>
        <div>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-success fw-bold">+ Nuevo Usuario</a>
            <a th:href="@{/empleados}" class="btn btn-secondary">Volver</a>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-striped table-hover text-center align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.idusuario}"></td>
                    <td th:text="${u.nomusuario}" class="fw-bold"></td>
                    <td th:text="${u.email}"></td>

                    <!-- 2. Extraemos el rol. Como es una lista/set, usamos th:each para mostrarlo con un diseño de "etiqueta" (badge) -->
                    <td>
                            <span th:each="rol : ${u.roles}"
                                  th:text="${rol.nomrol}"
                                  class="badge bg-info text-dark me-1">
                            </span>
                    </td>

                    <td>
                        <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                        <span th:unless="${u.activo}" class="badge bg-danger">Inactivo</span>
                    </td>
                    <td>
                        <a th:href="@{/usuarios/editar/{id}(id=${u.idusuario})}" class="btn btn-sm btn-primary">✏️ Editar</a>
                        <a th:href="@{/usuarios/estado/{id}(id=${u.idusuario})}"
                           th:class="${u.activo} ? 'btn btn-sm btn-outline-danger' : 'btn btn-sm btn-outline-success'"
                           th:text="${u.activo} ? '🚫 Desactivar' : '✅ Activar'">
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
