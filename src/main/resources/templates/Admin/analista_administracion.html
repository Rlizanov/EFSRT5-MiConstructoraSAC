<!DOCTYPE html> 
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Administración Analistas Programador</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#dcdcdc,#f1f1f1);min-height:100vh;font-family:'Segoe UI',sans-serif;}
.navbar{background:linear-gradient(90deg,#4b4b4b,#2f2f2f)!important;box-shadow:0 4px 15px rgba(0,0,0,0.3);}
.card{border:none;border-radius:18px;background:#f8f9fa;box-shadow:0 8px 25px rgba(0,0,0,0.15);transition:0.3s;}
.card:hover{transform:translateY(-4px);}
.card-header{background:linear-gradient(90deg,#6c757d,#495057)!important;color:white!important;font-weight:600;letter-spacing:1px;border-radius:18px 18px 0 0!important;}
.form-control,.form-select{background:#e9ecef;border:1px solid #ced4da;border-radius:12px;padding:10px;transition:0.2s;}
.form-control:focus,.form-select:focus{background:white;border-color:#6c757d;box-shadow:0 0 0 3px rgba(108,117,125,0.25);}
.table{background:#f8f9fa;border-radius:15px;overflow:hidden;}
.table thead{background:linear-gradient(90deg,#6c757d,#495057);color:white;}
.table-hover tbody tr:hover{background:#dee2e6;transition:0.2s;}
.badge{background:#6c757d!important;padding:6px 10px;border-radius:8px;font-weight:500;}
.table-responsive{border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,0.1);}
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark shadow">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Administración Analistas</span>
    <a th:href="@{/analistas}" class="btn btn-outline-light">← Volver</a>
  </div>
</nav>

<div class="container mt-4">

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

<div class="card shadow mb-4">
    <div class="card-header bg-primary text-white">
        Registrar / Editar Analista
    </div>

    <div class="card-body">
        <form th:action="@{/analistas/guardar}" th:object="${analista}" method="post">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>ID Empleado existente</label>
                    <input type="number" class="form-control" th:field="*{idempleado}" id="id" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Lenguaje Principal</label>
                    <input type="text" class="form-control" th:field="*{lenguajeprincipal}" id="lenguaje" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Experiencia (años)</label>
                    <input type="number" class="form-control" th:field="*{experienciaanios}" id="experiencia" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Nivel</label>
                    <select class="form-select" th:field="*{nivel}" id="nivel" required>
                        <option value="Junior">Junior</option>
                        <option value="Semi Senior">Semi Senior</option>
                        <option value="Senior">Senior</option>
                    </select>
                </div>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-success">Guardar</button>
            </div>
        </form>
    </div>
</div>

<div class="table-responsive">
<table class="table table-bordered table-hover shadow">
<thead class="table-dark text-center">
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Lenguaje Principal</th>
<th>Experiencia</th>
<th>Nivel</th>
<th>Editar</th>
<th>Eliminar</th>
</tr>
</thead>

<tbody class="text-center">
<tr th:each="a : ${lista}">
<td th:text="${a.idempleado}"></td>
<td th:text="${a.nomempleado}"></td>
<td th:text="${a.lenguajeprincipal}"></td>
<td th:text="${a.experienciaanios}"></td>
<td><span class="badge" th:text="${a.nivel}"></span></td>

<td>
<button type="button" class="btn btn-warning btn-sm"
th:attr="onclick=|cargarDatos(${a.idempleado},'${a.lenguajeprincipal}',${a.experienciaanios},'${a.nivel}')|">
Editar
</button>
</td>

<td>
<a th:href="@{/analistas/eliminar/{id}(id=${a.idempleado})}" class="btn btn-danger btn-sm"
onclick="return confirm('¿Eliminar este analista?')">Eliminar</a>
</td>
</tr>
</tbody>
</table>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function cargarDatos(id, lenguaje, experiencia, nivel){
    document.getElementById("id").value = id;
    document.getElementById("lenguaje").value = lenguaje;
    document.getElementById("experiencia").value = experiencia;
    document.getElementById("nivel").value = nivel;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

</body>
</html>
