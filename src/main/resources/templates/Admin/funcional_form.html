<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Formulario Funcional</title>

<style>

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #5f2c82, #7b4397);
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.form-container {
    background: white;
    color: #333;
    padding: 35px;
    border-radius: 20px;
    width: 420px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.form-container img {
    display: block;
    margin: 0 auto 20px auto;
    width: 90px;
}

h2 {
    text-align: center;
    color: #5f2c82;
    margin-bottom: 20px;
}

label {
    font-weight: 600;
    color: #5f2c82;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px 0;
    border-radius: 10px;
    border: 1px solid #ddd;
    background: #f3f0f7;
    box-sizing: border-box;
}

input[readonly] {
    background: #e9e9e9;
    cursor: not-allowed;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, #5f2c82, #7b4397);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    transform: scale(1.03);
}

.volver {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #5f2c82;
    text-decoration: none;
    font-weight: 600;
}

.mensaje-error{
    background:#ffd9d9;
    color:#a10000;
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
    font-weight:bold;
}

.mensaje-ok{
    background:#d9ffe3;
    color:#006b1b;
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="form-container">

<img src="https://cdn-icons-png.flaticon.com/512/2921/2921222.png">

<h2>Formulario Funcional</h2>

<div th:if="${error}" class="mensaje-error" th:text="${error}"></div>
<div th:if="${success}" class="mensaje-ok" th:text="${success}"></div>

<form th:action="@{/funcionales/guardar}" th:object="${funcional}" method="post">

    <input type="hidden" th:field="*{idempleado}">

    <label>ID Empleado:</label>
    <input type="number" th:field="*{idempleado}" readonly>

    <label>Área:</label>
    <input type="text" th:field="*{area}" required>

    <label>Proceso:</label>
    <input type="text" th:field="*{proceso}" required>

    <label>Herramienta:</label>
    <input type="text" th:field="*{herramienta}" required>

    <button type="submit">Guardar</button>

</form>

<a th:href="@{/funcionales}" class="volver">← Volver</a>

</div>

</body>
</html>
