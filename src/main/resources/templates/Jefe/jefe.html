<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Jefe de Proyecto</title>

<style>

:root{
    --rojo:#c62828;
    --rojo-oscuro:#a31515;
    --gris-fondo:#f4f6f9;
    --gris-card:#ffffff;
    --texto:#333;
}

body{
    font-family:'Segoe UI',sans-serif;
    margin:0;
    background:var(--gris-fondo);
    color:var(--texto);
}

header{
    background:linear-gradient(90deg,var(--rojo),var(--rojo-oscuro));
    color:white;
    padding:18px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
}

header h2{
    margin:0;
    font-weight:600;
    letter-spacing:1px;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:25px;
}

.dropdown button{
    background:none;
    border:none;
    color:white;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
}

.dropdown-content{
    display:none;
    position:absolute;
    background:white;
    min-width:220px;
    border-radius:14px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    overflow:hidden;
    z-index:999;
}

.dropdown-content a{
    padding:12px 15px;
    display:block;
    text-decoration:none;
    color:#333;
}

.dropdown-content a:hover{
    background:var(--rojo);
    color:white;
}

.dropdown:hover .dropdown-content{
    display:block;
}

.container{
    display:flex;
    gap:30px;
    padding:30px 40px;
}

.left{
    flex:3;
}

.right{
    flex:1.4;
}

.card{
    background:white;
    padding:28px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.card h3{
    margin-top:0;
    color:var(--rojo);
    font-size:22px;
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#444;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:13px 14px;
    margin-bottom:18px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:var(--rojo);
}

button{
    border:none;
    color:white;
    cursor:pointer;
    border-radius:12px;
    font-weight:600;
}

.btn-editar{
    background:#1976d2;
    padding:9px 18px;
}

.btn-eliminar{
    background:#333;
    padding:9px 18px;
}

.btn-guardar{
    background:linear-gradient(45deg,var(--rojo),var(--rojo-oscuro));
    width:100%;
    padding:14px;
    font-size:16px;
    margin-top:8px;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:15px;
}

table th{
    background:var(--rojo);
    color:white;
    padding:14px;
    text-align:left;
}

table td{
    padding:16px;
    border-bottom:1px solid #eee;
}

table tr:hover{
    background:#fff3f3;
}

td:last-child{
    display:flex;
    gap:8px;
}

/* RESPONSIVE */
@media(max-width:1100px){
    .container{
        flex-direction:column;
    }
}

</style>
</head>

<body>

<header>

<h2>Panel Jefe de Proyecto</h2>

<div class="nav-right">

<div class="dropdown">
<button>Trabajos ▾</button>

<div class="dropdown-content">
<a href="/empleados">Empleado</a>
<a href="/analistas">Analista Programador</a>
<a href="/ingenieros">Ingeniero Civil</a>
<a href="/funcionales">Analista Funcional</a>
<a href="/administrador">Administrador</a>
<a href="/jefes">Jefe de Proyectos</a>
</div>
</div>

<a href="/login" style="color:white;text-decoration:none;font-weight:bold;">
Cerrar Sesión
</a>

</div>
</header>

<div class="container">

<!-- TABLA -->
<div class="left">

<div class="card">

<h3>Lista de Proyectos</h3>

<table>

<tr>
<th>ID</th>
<th>Nombre</th>
<th>Ubicación</th>
<th>Presupuesto</th>
<th>Inicio</th>
<th>Fin</th>
<th>Acciones</th>
</tr>

<tr th:each="o : ${obras}">
<td th:text="${o.idobra}"></td>
<td th:text="${o.nombreobra}"></td>
<td th:text="${o.ubicacion}"></td>
<td th:text="${o.presupuesto}"></td>
<td th:text="${o.fechainicio}"></td>
<td th:text="${o.fechafin}"></td>

<td>
<a th:href="@{/jefes/editar/{id}(id=${o.idobra})}">
<button type="button" class="btn-editar">Editar</button>
</a>

<a th:href="@{/jefes/eliminar/{id}(id=${o.idobra})}">
<button type="button" class="btn-eliminar">Eliminar</button>
</a>
</td>
</tr>

</table>

</div>
</div>

<!-- FORMULARIO -->
<div class="right">

<div class="card">

<h3>Crear / Editar Proyecto</h3>

<form th:action="@{/jefes/guardar}" method="post" th:object="${obra}">

<input type="hidden" th:field="*{idobra}">

<label>Nombre del Proyecto:</label>
<input type="text" th:field="*{nombreobra}" required>

<label>Ubicación:</label>
<input type="text" th:field="*{ubicacion}" required>

<label>Presupuesto:</label>
<input type="number" step="0.01" th:field="*{presupuesto}" required>

<label>Fecha Inicio:</label>
<input type="date" th:field="*{fechainicio}">

<label>Fecha Fin:</label>
<input type="date" th:field="*{fechafin}">

<button type="submit" class="btn-guardar">
Guardar Proyecto
</button>

</form>

</div>
</div>

</div>

</body>
</html>
